<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>STM32 固件升级控制台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<main class="shell">
  <header><div class="eyebrow">UART IAP · LOCAL CONSOLE</div><h1>固件升级控制台</h1><p>STM32F407 · 115200 baud · CRC16 / CRC32</p></header>
  <div class="grid">
    <section class="card"><div class="card-head"><span class="num">01</span><div><h2>串口连接</h2><small>选择并连接目标设备</small></div><span id="connectionDot" class="dot"></span></div>
      <label>可用串口</label><div class="row"><select id="port"></select><button class="ghost" onclick="scan()">刷新</button></div>
      <div class="row"><button id="connectBtn" class="primary" onclick="connect()">连接设备</button><button class="ghost" onclick="disconnect()">断开</button></div>
      <div id="connectionText" class="hint">未连接</div>
    </section>
    <section class="card"><div class="card-head"><span class="num">02</span><div><h2>固件选择</h2><small>仅支持 .bin · 最大 {{ max_size // 1024 }} KiB</small></div></div>
      <label class="drop"><input id="file" type="file" accept=".bin,application/octet-stream"><span>点击选择或拖入固件</span><strong id="filename">尚未选择文件</strong></label>
      <div class="meta"><span>文件大小<strong id="filesize">—</strong></span><span>CRC32<strong id="crc32">—</strong></span></div>
      <button id="startBtn" class="primary wide" onclick="start()" disabled>开始升级</button>
    </section>
  </div>
  <section class="card progress-card"><div class="card-head"><span class="num">03</span><div><h2>烧录进度</h2><small id="statusText">等待操作</small></div><b id="percent">0%</b></div>
    <div class="progress"><i id="bar"></i></div><div class="state-row"><span id="phase">空闲</span><span id="jump">JUMP：—</span></div>
    <div class="log-head"><span>运行日志</span><button class="text-btn" onclick="clearLog()">清空</button></div><pre id="logs">等待串口连接与固件选择…</pre>
  </section>
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body></html>
